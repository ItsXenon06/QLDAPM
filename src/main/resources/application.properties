spring.application.name=qldapm
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:6000};databaseName=${DB_NAME:QLSieuThiDienMay};encrypt=true;trustServerCertificate=${DB_TRUST_CERT:true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.use_nationalized_character_data=true
server.port=8081
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.security.max-failed-logins=5
app.security.lock-minutes=15
app.seed.admin-password=${ADMIN_PASSWORD:}